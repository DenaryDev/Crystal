[versions]
# Platforms
paper = "26.1.2.build.+"
velocity = "3.5.0-SNAPSHOT"
core = "1.2.0-SNAPSHOT"

# Configs
configurate = "4.3.0-DEV-SNAPSHOT" # Version from our repository with YAML comment support

# Plugins
skinsrestorer = "15.7.7"

# SQL
hikari = "7.1.0"
## Local
sqlite = "3.53.2.0"
h2 = "2.4.240"
## Remote
mysql = "9.7.0"
mariadb = "3.5.9"
postgresql = "42.7.11"

# Shared
slf4j = "2.0.18"
jspecify = "1.0.0"

# Tests
mockbukkit = "4.113.2"

# Plugins
buildconfig = "6.0.10"
plugin-yml = "0.9.0"
run-task = "3.0.2"

[libraries]
# Platforms
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
core = { module = "ru.prostocraft.core:core", version.ref = "core" }

# Configs
configurate-core = { module = "io.sapphiremc.lib:configurate-core", version.ref = "configurate" }
configurate-hocon = { module = "io.sapphiremc.lib:configurate-hocon", version.ref = "configurate" }
configurate-yaml = { module = "io.sapphiremc.lib:configurate-yaml", version.ref = "configurate" }

# Plugins
skinsrestorer = { module = "net.skinsrestorer:skinsrestorer-api", version.ref = "skinsrestorer" }

# SQL
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
## Local
driver-sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
driver-h2 = { module = "com.h2database:h2", version.ref = "h2" }
## Remote
driver-mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
driver-mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
driver-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Shared
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# Tests
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }

[bundles]
sql-drivers = ["driver-sqlite", "driver-h2", "driver-mysql", "driver-mariadb", "driver-postgresql"]
configurate = ["configurate-hocon", "configurate-yaml"]

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
pluginyml = { id = "de.eldoria.plugin-yml.paper", version.ref = "plugin-yml" }
runpaper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
runvelocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
